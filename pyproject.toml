[project]
name = "hydra-htcondor-launcher"
version = "0.1.0"
description = "Hydra launcher plugin for HTCondor clusters"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "cloudpickle>=3.0.0",
    "hydra-core>=1.3.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[project.entry-points."hydra.plugins"]
htcondor_launcher = "hydra_plugins.hydra_htcondor_launcher"

[dependency-groups]
dev = ["pytest>=7.0.0"]
